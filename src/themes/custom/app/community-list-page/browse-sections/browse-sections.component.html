<div class="bhbta-browse" *ngIf="!loading(); else loadingTpl">
  <!-- Sticky table of contents -->
  <nav class="bhbta-browse__toc" aria-label="Sections">
    <p class="bhbta-browse__toc-label">On this page</p>
    <ul>
      <li *ngFor="let s of sections()">
        <a [href]="'#' + s.anchor">{{ s.name }}</a>
      </li>
    </ul>
  </nav>

  <!-- Always-expanded Section → Subsection → Collection index -->
  <div class="bhbta-browse__index">
    <section class="bhbta-browse__section" *ngFor="let s of sections()" [id]="s.anchor">
      <h2 class="bhbta-browse__section-title">
        <a [routerLink]="['/communities', s.uuid]">{{ s.name }}</a>
        <span class="bhbta-browse__count" [class.is-zero]="counts()[s.uuid] === 0"
              [attr.aria-label]="counts()[s.uuid] != null ? counts()[s.uuid] + ' items' : null">{{ counts()[s.uuid] }}</span>
      </h2>

      <div class="bhbta-browse__sub" *ngFor="let sub of s.subsections">
        <h3 class="bhbta-browse__sub-title">
          <a [routerLink]="['/communities', sub.uuid]">{{ sub.name }}</a>
          <span class="bhbta-browse__count" [class.is-zero]="counts()[sub.uuid] === 0"
                [attr.aria-label]="counts()[sub.uuid] != null ? counts()[sub.uuid] + ' items' : null">{{ counts()[sub.uuid] }}</span>
        </h3>
        <ul class="bhbta-browse__collections" *ngIf="sub.collections.length; else noCols">
          <li *ngFor="let col of sub.collections">
            <a [routerLink]="['/collections', col.uuid]">{{ col.name }}</a>
            <span class="bhbta-browse__count" [class.is-zero]="counts()[col.uuid] === 0"
                  [attr.aria-label]="counts()[col.uuid] != null ? counts()[col.uuid] + ' items' : null">{{ counts()[col.uuid] }}</span>
          </li>
        </ul>
        <ng-template #noCols><p class="bhbta-browse__empty">No collections yet</p></ng-template>
      </div>
    </section>
  </div>
</div>

<ng-template #loadingTpl>
  <p class="bhbta-browse__loading">Loading sections…</p>
</ng-template>
